apiVersion: v1
kind: Pod
metadata:
  name: account-storage-test
  namespace: skillfybank
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  containers:
    - name: storage-test
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: account-data
          mountPath: /data
  volumes:
    - name: account-data
      persistentVolumeClaim:
        claimName: account-pvc
