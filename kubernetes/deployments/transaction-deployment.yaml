apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: skillfybank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: jayantrajput/skillfybank-transaction:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: skillfybank-config
            - secretRef:
                name: skillfybank-db-secret
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
